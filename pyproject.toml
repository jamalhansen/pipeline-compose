[project]
name = "pipeline-compose"
version = "0.1.0"
description = "Chains local-first tool CLIs into named pipelines defined in YAML, piping each step's captured output into the next step's command."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=14.3.3",
    "local-first-common",
    "pyyaml>=6.0.2",
]

[project.scripts]
pipeline-compose = "pipeline_compose.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_compose"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
